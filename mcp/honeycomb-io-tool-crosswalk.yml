mcp_only:
  - tool: find_queries
    reason: No public REST endpoint exposes query history or intent search over saved queries.
  - tool: run_bubbleup
    reason: BubbleUp is a UI/analysis capability with no public REST operation.
  - tool: search_semconv
    reason: OpenTelemetry semantic-convention registry lookup; not part of the Honeycomb REST API.
  - tool: get_semconv_attribute
    reason: Semantic-convention attribute lookup; no REST equivalent.
  - tool: list_semconv_namespaces
    reason: Semantic-convention namespace listing; no REST equivalent.
  - tool: canvas_agent_invoke
    reason: Canvas investigations have no public REST surface.
  - tool: canvas_agent_poll_response
    reason: Canvas investigations have no public REST surface.
  - tool: list_aiconversations
    reason: gen_ai.* conversation rollups are an MCP-side aggregation over query results.
  - tool: get_aiconversation
    reason: gen_ai.* conversation timeline is an MCP-side aggregation over query results.
  - tool: refinery_docs
    reason: Documentation retrieval tool; not an API operation.
  - tool: feedback
    reason: Feedback channel to the MCP maintainers; not an API operation.
  - tool: search_honeycomb_docs
    reason: Docs-MCP tool over published documentation only.
  - tool: query_docs_filesystem_honeycomb_docs
    reason: Docs-MCP virtual filesystem over published documentation only.
  - tool: submit_feedback
    reason: Docs-MCP feedback channel.
rest_only:
  - operations: [createEvent, createEvents, createKinesisEvents]
    reason: Telemetry ingest. Deliberately not exposed as an agent tool - agents read data, they do not write events.
  - operations: [createDataset, updateDataset, deleteDataset, listDatasets]
    reason: Dataset lifecycle management is REST/Terraform-only; deleteDataset is documented as irreversible.
  - operations: [patchDatasetDefinitions, listDatasetDefinitions]
    reason: Dataset definitions have no MCP tool.
  - operations: [createColumn, updateColumn, deleteColumn, getColumn]
    reason: Column mutation is REST/Terraform-only; MCP exposes column reads.
  - operations: [createCalculatedField, updateCalculatedField, deleteCalculatedField, getCalculatedField, listCalculatedFields]
    reason: Calculated fields are only reached indirectly, via create_slo.
  - operations: [createMarker, getMarker, updateMarker, deleteMarker, createMarkerSetting, listMarkerSettings, updateMarkerSettings, deleteMarkerSettings]
    reason: Markers and marker settings have no MCP tool; use the REST API, honeymarker CLI or Terraform provider.
  - operations: [createQueryAnnotation, listQueryAnnotations, getQueryAnnotation, updateQueryAnnotation, deleteQueryAnnotation]
    reason: Query annotations have no MCP tool.
  - operations: [listApiKeys, createApiKey, getApiKey, updateApiKey, deleteApiKey]
    reason: Credential management is deliberately excluded from the agent surface.
  - operations: [createEnvironment, updateEnvironment, deleteEnvironment]
    reason: Environment mutation is excluded from the agent surface; MCP reads environments only.
  - operations: [createBurnAlert, listBurnAlertsBySlo, getBurnAlert, updateBurnAlert, deleteBurnAlert]
    reason: Burn alerts have no dedicated MCP tool; SLO tools cover the parent object.
  - operations: [getSloHistory]
    reason: SLO Reporting API is Enterprise-only and has no MCP tool.
  - operations: [deleteBoard, deleteTrigger, deleteSlo, deleteRecipient]
    reason: >-
      Every destructive delete is withheld from the MCP surface. The MCP write scope covers
      create and update only - a deliberate blast-radius decision worth noting.
  - operations: [getAuth]
    reason: V1 key introspection; MCP identity comes from the OAuth session.
  - operations: [updateSignal, listSignalHistoricalAnomalies]
    reason: Anomaly Detection signal mutation and history have no MCP tool.
