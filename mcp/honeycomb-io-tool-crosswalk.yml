provider: Honeycomb
providerId: honeycomb-io
description: >-
  Crosswalk between the tools Honeycomb's hosted MCP server exposes to agents and the REST
  operations in its public OpenAPI. Where a tool maps to a REST operation, the tool inherits
  that operation's parameters and requestBody as its real input schema. Confidence is recorded
  honestly: the live MCP schemas are OAuth-gated, so bindings are made by name and documented
  semantics, not by comparing live schemas.
