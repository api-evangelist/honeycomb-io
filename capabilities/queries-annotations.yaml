      description: Create a Query Annotation
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: queries-annotations.createqueryannotation
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: honeycomb-queries-annotations-listqueryannotations
      description: List Query Annotations
      hints:
