naftiko: 1.0.0-alpha2
info:
  label: "Honeycomb Columns API \u2014 Columns"
  description: "Honeycomb Columns API \u2014 Columns. 5 operations. Lead operation: Create a Column. Self-contained Naftiko capability covering one Honeycomb business surface."
  tags:
  - Honeycomb
  - Observability
  - Columns
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    HONEYCOMB_API_KEY: HONEYCOMB_API_KEY
capability:
  consumes:
  - type: http
    namespace: columns-columns
    baseUri: https://api.honeycomb.io
    description: "Honeycomb Columns API \u2014 Columns business capability. Self-contained, no shared references."
    resources:
    - name: 1-columns
      path: /1/columns/{datasetSlug}
      operations:
      - name: createcolumn
        method: POST
        description: Create a Column
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listcolumns
        method: GET
        description: List all Columns
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: key_name
          in: query
          type: string
          description: the column key name
          required: false
    - name: 1-columns
      path: /1/columns/{datasetSlug}/{columnId}
      operations:
      - name: getcolumn
        method: GET
        description: Get a Column
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatecolumn
        method: PUT
        description: Update a Column
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletecolumn
        method: DELETE
        description: Delete a Column
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Honeycomb-Team
      value: '{{env.HONEYCOMB_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: columns-columns-rest
    port: 8080
    description: "REST adapter for Honeycomb Columns API \u2014 Columns. One Spectral-compliant resource per consumed operation, prefixed with /v1."
    resources:
    - path: /v1/1/columns/{datasetSlug}
      name: 1-columns
      description: REST surface for 1-columns.
      operations:
      - method: POST
        name: createcolumn
        description: Create a Column
        call: columns-columns.createcolumn
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listcolumns
        description: List all Columns
        call: columns-columns.listcolumns
        with:
          key_name: rest.key_name
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/1/columns/{datasetSlug}/{columnId}
      name: 1-columns
      description: REST surface for 1-columns.
      operations:
      - method: GET
        name: getcolumn
        description: Get a Column
        call: columns-columns.getcolumn
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatecolumn
        description: Update a Column
        call: columns-columns.updatecolumn
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletecolumn
        description: Delete a Column
        call: columns-columns.deletecolumn
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: columns-columns-mcp
    port: 9090
    transport: http
    description: "MCP adapter for Honeycomb Columns API \u2014 Columns. One tool per consumed operation, routed inline through this capability's consumes block."
    tools:
    - name: honeycomb-columns-columns-createcolumn
      description: Create a Column
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: columns-columns.createcolumn
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: honeycomb-columns-columns-listcolumns
      description: List all Columns
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: columns-columns.listcolumns
      with:
        key_name: tools.key_name
      outputParameters:
      - type: object
        mapping: $.
    - name: honeycomb-columns-columns-getcolumn
      description: Get a Column
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: columns-columns.getcolumn
      outputParameters:
      - type: object
        mapping: $.
    - name: honeycomb-columns-columns-updatecolumn
      description: Update a Column
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: columns-columns.updatecolumn
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: honeycomb-columns-columns-deletecolumn
      description: Delete a Column
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: columns-columns.deletecolumn
      outputParameters:
      - type: object
        mapping: $.
