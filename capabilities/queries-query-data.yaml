naftiko: 1.0.0-alpha2
info:
  label: "Honeycomb Queries API \u2014 Query Data"
  description: "Honeycomb Queries API \u2014 Query Data. 2 operations. Lead operation: Create a Query Result. Self-contained Naftiko capability covering one Honeycomb business surface."
  tags:
  - Honeycomb
  - Observability
  - Query Data
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    HONEYCOMB_API_KEY: HONEYCOMB_API_KEY
capability:
  consumes:
  - type: http
    namespace: queries-query-data
    baseUri: https://api.honeycomb.io
    description: "Honeycomb Queries API \u2014 Query Data business capability. Self-contained, no shared references."
    resources:
    - name: 1-query-results
      path: /1/query_results/{datasetSlug}
      operations:
      - name: createqueryresult
        method: POST
        description: Create a Query Result
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: 1-query-results
      path: /1/query_results/{datasetSlug}/{queryResultId}
      operations:
      - name: getqueryresult
        method: GET
        description: Get Query Result
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Honeycomb-Team
      value: '{{env.HONEYCOMB_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: queries-query-data-rest
    port: 8080
    description: "REST adapter for Honeycomb Queries API \u2014 Query Data. One Spectral-compliant resource per consumed operation, prefixed with /v1."
    resources:
    - path: /v1/1/query_results/{datasetSlug}
      name: 1-query-results
      description: REST surface for 1-query-results.
      operations:
      - method: POST
        name: createqueryresult
        description: Create a Query Result
        call: queries-query-data.createqueryresult
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/1/query_results/{datasetSlug}/{queryResultId}
      name: 1-query-results
      description: REST surface for 1-query-results.
      operations:
      - method: GET
        name: getqueryresult
        description: Get Query Result
        call: queries-query-data.getqueryresult
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: queries-query-data-mcp
    port: 9090
    transport: http
    description: "MCP adapter for Honeycomb Queries API \u2014 Query Data. One tool per consumed operation, routed inline through this capability's consumes block."
    tools:
    - name: honeycomb-queries-query-data-createqueryresult
      description: Create a Query Result
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: queries-query-data.createqueryresult
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: honeycomb-queries-query-data-getqueryresult
      description: Get Query Result
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: queries-query-data.getqueryresult
      outputParameters:
      - type: object
        mapping: $.
