naftiko: 1.0.0-alpha2
info:
  label: "Honeycomb Boards API \u2014 Boards"
  description: "Honeycomb Boards API \u2014 Boards. 5 operations. Lead operation: Create a Board. Self-contained Naftiko capability covering one Honeycomb business surface."
  tags:
  - Honeycomb
  - Observability
  - Boards
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    HONEYCOMB_API_KEY: HONEYCOMB_API_KEY
capability:
  consumes:
  - type: http
    namespace: boards-boards
    baseUri: https://api.honeycomb.io
    description: "Honeycomb Boards API \u2014 Boards business capability. Self-contained, no shared references."
    resources:
    - name: 1-boards
      path: /1/boards
      operations:
      - name: createboard
        method: POST
        description: Create a Board
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listboards
        method: GET
        description: List All Boards
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: 1-boards
      path: /1/boards/{boardId}
      operations:
      - name: getboard
        method: GET
        description: Get a Board
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateboard
        method: PUT
        description: Update a Board
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteboard
        method: DELETE
        description: Delete a Board
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Honeycomb-Team
      value: '{{env.HONEYCOMB_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: boards-boards-rest
    port: 8080
    description: "REST adapter for Honeycomb Boards API \u2014 Boards. One Spectral-compliant resource per consumed operation, prefixed with /v1."
    resources:
    - path: /v1/1/boards
      name: 1-boards
      description: REST surface for 1-boards.
      operations:
      - method: POST
        name: createboard
        description: Create a Board
        call: boards-boards.createboard
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listboards
        description: List All Boards
        call: boards-boards.listboards
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/1/boards/{boardId}
      name: 1-boards
      description: REST surface for 1-boards.
      operations:
      - method: GET
        name: getboard
        description: Get a Board
        call: boards-boards.getboard
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateboard
        description: Update a Board
        call: boards-boards.updateboard
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteboard
        description: Delete a Board
        call: boards-boards.deleteboard
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: boards-boards-mcp
    port: 9090
    transport: http
    description: "MCP adapter for Honeycomb Boards API \u2014 Boards. One tool per consumed operation, routed inline through this capability's consumes block."
    tools:
    - name: honeycomb-boards-boards-createboard
      description: Create a Board
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: boards-boards.createboard
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: honeycomb-boards-boards-listboards
      description: List All Boards
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: boards-boards.listboards
      outputParameters:
      - type: object
        mapping: $.
    - name: honeycomb-boards-boards-getboard
      description: Get a Board
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: boards-boards.getboard
      outputParameters:
      - type: object
        mapping: $.
    - name: honeycomb-boards-boards-updateboard
      description: Update a Board
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: boards-boards.updateboard
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: honeycomb-boards-boards-deleteboard
      description: Delete a Board
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: boards-boards.deleteboard
      outputParameters:
      - type: object
        mapping: $.
