naftiko: 1.0.0-alpha2
info:
  label: "Honeycomb Datasets API \u2014 Dataset Definitions"
  description: "Honeycomb Datasets API \u2014 Dataset Definitions. 2 operations. Lead operation: Set or Update Dataset Definitions. Self-contained Naftiko capability covering one Honeycomb business surface."
  tags:
  - Honeycomb
  - Observability
  - Dataset Definitions
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    HONEYCOMB_API_KEY: HONEYCOMB_API_KEY
capability:
  consumes:
  - type: http
    namespace: datasets-definitions
    baseUri: https://api.honeycomb.io
    description: "Honeycomb Datasets API \u2014 Dataset Definitions business capability. Self-contained, no shared references."
    resources:
    - name: 1-dataset-definitions
      path: /1/dataset_definitions/{datasetSlug}
      operations:
      - name: patchdatasetdefinitions
        method: PATCH
        description: Set or Update Dataset Definitions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listdatasetdefinitions
        method: GET
        description: Get all Dataset Definitions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Honeycomb-Team
      value: '{{env.HONEYCOMB_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: datasets-definitions-rest
    port: 8080
    description: "REST adapter for Honeycomb Datasets API \u2014 Dataset Definitions. One Spectral-compliant resource per consumed operation, prefixed with /v1."
    resources:
    - path: /v1/1/dataset_definitions/{datasetSlug}
      name: 1-dataset-definitions
      description: REST surface for 1-dataset-definitions.
      operations:
      - method: PATCH
        name: patchdatasetdefinitions
        description: Set or Update Dataset Definitions
        call: datasets-definitions.patchdatasetdefinitions
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listdatasetdefinitions
        description: Get all Dataset Definitions
        call: datasets-definitions.listdatasetdefinitions
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: datasets-definitions-mcp
    port: 9090
    transport: http
    description: "MCP adapter for Honeycomb Datasets API \u2014 Dataset Definitions. One tool per consumed operation, routed inline through this capability's consumes block."
    tools:
    - name: honeycomb-datasets-definitions-patchdatasetdefinitions
      description: Set or Update Dataset Definitions
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: datasets-definitions.patchdatasetdefinitions
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: honeycomb-datasets-definitions-listdatasetdefinitions
      description: Get all Dataset Definitions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: datasets-definitions.listdatasetdefinitions
      outputParameters:
      - type: object
        mapping: $.
