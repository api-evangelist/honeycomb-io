  name: Honeycomb Dataset Definitions API
  description: >-
    Dataset definitions describe the fields with special meaning in the Dataset.


    Refer to the [Dataset Definitions](https://docs.honeycomb.io/configure/datasets/definitions/) documentation
    for more information.


    **Honeycomb automatically creates these Dataset definition fields when the Dataset is created.**

    Manual creation of Dataset definitions is **not** needed.


