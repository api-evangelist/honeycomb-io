name: Honeycomb
description: >-
  Honeycomb is an observability platform for understanding complex distributed systems through
  high-cardinality, high-dimensional telemetry. Founded in 2016 by Charity Majors and Christine
  Yen and headquartered in San Francisco, it stores traces, logs and metrics as wide events and
  lets engineers query arbitrarily across every field at interactive speed, rather than
  pre-defining dashboards and thresholds. Honeycomb is OpenTelemetry-native: OTLP is the
  documented ingest path and the company has moved its own proprietary Beelines and
  distributions to End of Life in favour of upstream OpenTelemetry SDKs. The public REST API is
  described by a single OpenAPI 3.1 contract covering 89 operations across 22 resource groups -
  events, datasets, columns, calculated fields, queries, query data, boards, triggers, SLOs,
  burn alerts, markers, recipients, service maps, environments, API keys and anomaly detection
  signals - split across US and EU regions. Honeycomb also runs a first-party OAuth-protected
  Model Context Protocol server at mcp.honeycomb.io, publishes A2A and Agent Skills discovery
  documents from its docs host, and ships an official agent-skills plugin, making it one of the
  more complete agent-facing surfaces in the observability category. Products include the core
  observability platform, Refinery tail-based sampling, Telemetry Pipeline, and Canvas
  AI-assisted investigations.
