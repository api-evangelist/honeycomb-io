    configure.

    The graph on which to alert is as flexible as a Honeycomb query, which helps reduce false positives
    due to known errors.


    Triggers support both standard event-based datasets and metrics datasets. Metrics triggers have additional
    capabilities

    such as granularity control.

    Learn more in the [Triggers documentation](https://docs.honeycomb.io/notify/alert/triggers/).


    This API allows you to list, create, update, and delete Triggers.


