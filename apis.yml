- aid: honeycomb-io:honeycomb-io-calculated-fields-api
  name: Honeycomb Calculated Fields API
  description: >-
    Calculated Fields (also called Derived Columns) allow you to run queries based on the value of an
    expression that is calculated from the fields in an event.


    This API allows you to list, create, update, and delete Calculated Fields in a dataset or across a
    whole environment, paralleling the behavior of the Schema tab within a Dataset's or Environment's
    Settings UI.


    ## Authorization


    The API key must have the **Manage Queries and Columns** permission. Learn more about [API keys here](https://docs.honeycomb.io/configure/environments/manage-api-keys/).
